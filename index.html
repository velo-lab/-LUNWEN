<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论文写作服务 · 案例进展</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f8;min-height:100vh}

.header{background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;padding:20px 20px 24px}
.header h1{font-size:1.15rem;font-weight:700;margin-bottom:4px}
.header-sub{font-size:0.76rem;opacity:0.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,0.15);border-radius:10px;padding:10px 4px;text-align:center;font-size:0.62rem}
.stat-val{font-size:1.15rem;font-weight:700;display:block;margin-bottom:2px}

.toolbar{background:white;padding:12px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--gray-200)}
.search-box{flex:1;position:relative}
.search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--gray-200);border-radius:8px;font-size:0.85rem;outline:none}
.search-box input:focus{border-color:var(--primary)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:0.9rem;color:var(--gray-400)}

.filters{background:white;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--gray-200)}
.filters::-webkit-scrollbar{display:none}
.ftab{padding:6px 12px;border-radius:16px;font-size:0.78rem;background:var(--gray-100);border:none;color:var(--gray-600);cursor:pointer;font-weight:500;white-space:nowrap}
.ftab.active{background:var(--primary);color:white}

.cards-wrap{margin:12px;display:flex;flex-direction:column;gap:10px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);border-left:4px solid var(--primary)}
.card.done{border-left-color:var(--success)}
.card-head{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-topic{font-weight:600;font-size:0.92rem;flex:1;line-height:1.4;color:var(--gray-800)}
.card-body{padding:0 16px 14px}
.status-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:0.72rem;font-weight:600;white-space:nowrap}
.status-done{background:#d1fae5;color:#065f46}
.status-active{background:#fee2e2;color:#991b1b}
.status-wait{background:#fef3c7;color:#92400e}
.status-other{background:#e0e7ff;color:#3730a3}
.card-section{margin-top:10px;border-top:1px solid var(--gray-100);padding-top:8px}
.card-section-title{font-size:0.7rem;color:var(--gray-400);font-weight:600;margin-bottom:4px}
.progress-item{font-size:0.78rem;color:var(--gray-600);padding:2px 0;line-height:1.6}
.progress-item .p-stage{color:var(--primary);font-weight:600}
.progress-item .p-date{color:var(--gray-400)}
.card-updated{font-size:0.7rem;color:var(--gray-400);margin-top:10px}

.empty{text-align:center;padding:60px 20px;color:var(--gray-400)}
.empty-icon{font-size:3rem;margin-bottom:12px}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400}
.loading-overlay.hidden{display:none}
.loading-spinner{width:38px;height:38px;border:4px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;color:var(--gray-600);font-size:0.88rem}

.footer{padding:24px 20px 40px;text-align:center}
.footer a{font-size:0.78rem;color:var(--gray-400);text-decoration:none}
.footer a:hover{color:var(--primary)}

.hidden{display:none!important}

@media(min-width:768px){
  .header{padding:24px 28px 28px}
  .toolbar{padding:14px 24px}
  .filters{padding:10px 24px}
  .cards-wrap{margin:16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">加载中...</div>
</div>

<header class="header">
  <h1>📝 论文写作服务 · 案例进展</h1>
  <div class="header-sub">部分案例信息已做脱敏处理，不含客户身份与费用信息</div>
  <div class="stats">
    <div class="stat"><span class="stat-val" id="s-total">0</span>案例总数</div>
    <div class="stat"><span class="stat-val" id="s-active">0</span>进行中</div>
    <div class="stat"><span class="stat-val" id="s-done">0</span>已完成</div>
  </div>
</header>

<div class="toolbar">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索课题方向...">
  </div>
</div>

<div class="filters">
  <button class="ftab active" data-f="all">📋 全部</button>
  <button class="ftab" data-f="active">🔥 进行中</button>
  <button class="ftab" data-f="done">✅ 已完成</button>
</div>

<div class="cards-wrap" id="cardsWrap"></div>
<div class="empty hidden" id="cardsEmpty"><div class="empty-icon">📭</div><p>暂无公开案例</p></div>

<div class="footer">
  <a href="admin.html">🔐 管理员登录</a>
</div>

<script>
const SUPABASE_URL = 'https://jdkvhnhweffrvrlunqpv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impka3Zobmh3ZWZmcnZybHVucXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNTU0OTIsImV4cCI6MjA4NzgzMTQ5Mn0.r4UVbaz8k_CeuJanKRb01c2kZ6vtE8x0JIZSjkm195o';

let db, cases = [], currentFilter = 'all', searchQuery = '';

async function init() {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  try {
    const { data, error } = await db.from('orders_public').select('*').order('updated_at', { ascending: false });
    if (error) throw error;
    cases = data.map(d => ({
      id: d.id,
      topic: d.topic || '',
      serviceStatus: d.service_status || '',
      progresses: d.progresses || [],
      updatedAt: d.updated_at
    }));
  } catch (e) {
    document.getElementById('loadingOverlay').innerHTML =
      '<div style="text-align:center;padding:20px">' +
      '<div style="font-size:3rem">⚠️</div>' +
      '<div style="color:#ef4444;margin:10px 0">加载失败，请稍后重试</div>' +
      '<button onclick="location.reload()" style="padding:10px 20px;background:#6366f1;color:white;border:none;border-radius:8px;cursor:pointer">重试</button>' +
      '</div>';
    return;
  }
  document.getElementById('loadingOverlay').classList.add('hidden');
  render();
}

function isDone(o) { return o.serviceStatus === '清单'; }

function getStatusClass(s) {
  if (s === '清单') return 'status-done';
  if (['待沟通','待写初稿','待反馈','待成稿'].includes(s)) return 'status-wait';
  if (s === '服务中') return 'status-active';
  return 'status-other';
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`;
}

function getFiltered() {
  let list = [...cases];
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(o => o.topic.toLowerCase().includes(q));
  }
  if (currentFilter === 'active') list = list.filter(o => !isDone(o));
  else if (currentFilter === 'done') list = list.filter(o => isDone(o));
  return list;
}

function render() {
  updateStats();
  renderCards();
}

function updateStats() {
  document.getElementById('s-total').textContent = cases.length;
  document.getElementById('s-active').textContent = cases.filter(o => !isDone(o)).length;
  document.getElementById('s-done').textContent = cases.filter(o => isDone(o)).length;
}

function renderCards() {
  const list = getFiltered();
  const wrap = document.getElementById('cardsWrap');
  const empty = document.getElementById('cardsEmpty');
  if (!list.length) {
    wrap.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  wrap.innerHTML = list.map(o => {
    const sc = getStatusClass(o.serviceStatus);
    const progHtml = o.progresses.length
      ? o.progresses.map(p =>
          `<div class="progress-item">
            <span class="p-stage">${p.stage || ''}</span>
            <span class="p-date">${p.date ? ' · ' + fmtDate(p.date) : ''}</span>
          </div>`
        ).join('')
      : '<div style="color:#d1d5db;font-size:0.75rem">暂无进度</div>';
    return `<div class="card ${isDone(o) ? 'done' : ''}">
      <div class="card-head">
        <div class="card-topic">${o.topic}</div>
        <span class="status-badge ${sc}">${o.serviceStatus}</span>
      </div>
      <div class="card-body">
        <div class="card-section">
          <div class="card-section-title">📅 进度记录</div>
          ${progHtml}
        </div>
        <div class="card-updated">更新于 ${fmtDate(o.updatedAt)}</div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

document.querySelectorAll('.ftab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.f;
    render();
  });
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
